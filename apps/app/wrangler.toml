name = "boardstack-app"
main = "src/worker.ts"
compatibility_date = "2026-04-17"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
VITE_POSTHOG_KEY = "REPLACE_WITH_POSTHOG_PROJECT_KEY"
VITE_POSTHOG_HOST = "https://us.i.posthog.com"
VITE_GAVELHOUSE_SHUTDOWN = "true"

[[routes]]
pattern = "my.gavelhouse.app"
zone_name = "gavelhouse.app"
custom_domain = true
