services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boardstack_dev
    ports:
      - "55460:5432"
    volumes:
      - boardstack_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d boardstack_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  boardstack_postgres_data:
